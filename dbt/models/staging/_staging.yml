version: 2

models:
  - name: stg_air_quality_hourly
    description: >
      Staging view containing normalized hourly air-quality
      measurements from the Silver Iceberg table.

    columns:
      - name: city_id
        data_tests:
          - not_null

      - name: measured_at_utc
        data_tests:
          - not_null

      - name: source_system
        data_tests:
          - not_null

      - name: dataset_name
        data_tests:
          - not_null

      - name: record_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - historical
      - name: pm2_5
        description: PM2.5 concentration in micrograms per cubic meter.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 800

      - name: pm10
        description: PM10 concentration in micrograms per cubic meter.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1200

  - name: stg_weather_hourly
    description: >
      Staging view containing normalized hourly weather
      measurements from the Silver Iceberg table.

    columns:
      - name: city_id
        data_tests:
          - not_null

      - name: measured_at_utc
        data_tests:
          - not_null

      - name: source_system
        data_tests:
          - not_null

      - name: dataset_name
        data_tests:
          - not_null

      - name: record_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - historical

      - name: relative_humidity_2m
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: precipitation
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

      - name: rain
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

      - name: cloud_cover
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: wind_speed_10m
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0

      - name: wind_direction_10m
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 360

      - name: visibility
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
  - name: stg_sensor_readings
    description: >
      Canonical production IoT sensor events from Streaming Silver.
      One row represents one unique sensor event.

    columns:
      - name: event_id
        description: Globally unique identifier for one sensor event.
        data_tests:
          - not_null
          - unique

      - name: device_id
        data_tests:
          - not_null

      - name: sequence_number
        data_tests:
          - not_null

      - name: city_id
        data_tests:
          - not_null

      - name: event_time_utc
        data_tests:
          - not_null

      - name: processed_at
        data_tests:
          - not_null

      - name: schema_version
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "1.0"

      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - environment.sensor_reading

      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - iot_simulator

      - name: dataset_name
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - sensor_readings

      - name: quality_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - VALID

      - name: relative_humidity_2m
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100

      - name: pm2_5
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 800

      - name: pm10
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1200
 