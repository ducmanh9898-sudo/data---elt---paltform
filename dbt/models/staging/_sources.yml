version: 2

sources:
  - name: silver
    description: >
       Silver Iceberg tables produced by batch and streaming pipelines
        and queried through Trino.

    database: iceberg
    schema: silver

    config:
      freshness:
        warn_after:
          count: 36
          period: hour
        error_after:
          count: 72
          period: hour

      loaded_at_field: crawled_at_utc

    tables:
      - name: air_quality_hourly
        description: >
          Clean hourly air-quality data produced by Spark.

      - name: weather_hourly
        description: >
          Clean hourly weather data produced by Spark.

      - name: sensor_readings_clean
        description: >
          Canonical deduplicated IoT sensor events produced by Flink.

        config:
          # Streaming availability is managed separately from the
          # hourly batch source-freshness gate.
          freshness: null
