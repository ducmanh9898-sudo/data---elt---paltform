name: environment_platform
version: "1.0.0"
config-version: 2

profile: environment_platform

model-paths:
  - models

test-paths:
  - tests

macro-paths:
  - macros

clean-targets:
  - target
  - dbt_packages
  - logs

models:
  environment_platform:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: gold
      +on_table_exists: replace